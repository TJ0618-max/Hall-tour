<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HALL NOTE</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f3ef;--paper:#fffdf9;--paper2:#faf7f2;--ink:#242321;--onink:#fff;--sub:#77716b;--line:#e7e1d9;--accent:#a77b68;--soft:#eee2da;--softtx:#65493d;--softbd:#d8bcae;--gold:#b18a42;--danger:#a86660;--dbg:#f4e4e1;--gray:#eeeae5;--graytx:#625b55;--sumbg:#f1e7df;--sumbd:#e4d3c8;--bestbg:#eee0d8;--besttx:#5c3f34;--note:#f8f4ef;--thead:#f7f3ee;--white:#fff;--off:#d8d1ca;--inp:#fffdfb;--blur:rgba(246,243,239,.92);--sh:0 10px 32px rgba(48,39,31,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151413;--paper:#1d1b19;--paper2:#232120;--ink:#f1ece6;--onink:#1a1918;--sub:#a39b92;--line:#2e2a27;--accent:#c99c88;--soft:#3a2f2a;--softtx:#ecd5c8;--softbd:#55443b;--gold:#d0a85a;--danger:#d98c85;--dbg:#3a2624;--gray:#2a2724;--graytx:#c9c1b8;--sumbg:#2a2420;--sumbd:#3c332d;--bestbg:#3a2f28;--besttx:#f0d8c8;--note:#211f1c;--thead:#24211e;--white:#1d1b19;--off:#3a3632;--inp:#211f1d;--blur:rgba(21,20,19,.92);--sh:0 10px 32px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#151413;--paper:#1d1b19;--paper2:#232120;--ink:#f1ece6;--onink:#1a1918;--sub:#a39b92;--line:#2e2a27;--accent:#c99c88;--soft:#3a2f2a;--softtx:#ecd5c8;--softbd:#55443b;--gold:#d0a85a;--danger:#d98c85;--dbg:#3a2624;--gray:#2a2724;--graytx:#c9c1b8;--sumbg:#2a2420;--sumbd:#3c332d;--bestbg:#3a2f28;--besttx:#f0d8c8;--note:#211f1c;--thead:#24211e;--white:#1d1b19;--off:#3a3632;--inp:#211f1d;--blur:rgba(21,20,19,.92);--sh:0 10px 32px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--blur);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{max-width:760px;margin:auto;padding:18px 18px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bm{font-size:11px;letter-spacing:2.8px;color:var(--accent);font-weight:800}
.bt{font:20px Georgia,"Times New Roman",serif;letter-spacing:1px;margin-top:2px}
.br{font-size:11px;color:var(--sub);white-space:nowrap}
nav{max-width:760px;margin:auto;padding:0 14px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
nav button{background:transparent;color:#807970;border:0;border-radius:12px;padding:10px 5px;font-size:13px;font-weight:750;transition:.18s}
nav button.on{background:var(--ink);color:var(--onink)}
.wrap{max-width:760px;margin:auto;padding:20px 16px 70px}
button{font:inherit;font-size:12px;font-weight:750;border:0;border-radius:12px;padding:10px 14px;background:var(--ink);color:var(--onink);cursor:pointer;white-space:nowrap}
button.g{background:var(--gray);color:var(--graytx)}
button[data-act=del],button[data-act=ed]{background:var(--dbg);color:var(--danger)}
input,textarea{font:inherit;font-size:14px;width:100%;border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:12px;padding:11px 12px;outline:0;transition:.18s}
input:focus,textarea:focus{border-color:#c9a998;box-shadow:0 0 0 3px rgba(167,123,104,.1)}
textarea{min-height:105px;resize:vertical;line-height:1.55}
.add{display:flex;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}.add input{flex:1;min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:var(--sh);margin-bottom:12px}
.top{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"b s c" "m s c";align-items:center;column-gap:12px;padding:16px;cursor:pointer;transition:.15s}.top:active{background:var(--paper2)}
.top b{grid-area:b;font-size:16px;font-weight:800;letter-spacing:-.2px}
.top .meta{grid-area:m;font-size:11px;color:var(--sub);margin-top:5px}.top .meta:empty:before{content:"방문일 미정"}
.sc{grid-area:s;font:18px Georgia,serif;color:var(--gold);text-align:right}.sc:empty{display:none}
.top:after{content:"⌄";grid-area:c;font-size:18px;color:#aaa19a}.top:has(+.body):after{content:"⌃"}
.body{border-top:1px solid var(--line);padding:17px;background:var(--paper)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.l{display:block;font-size:10px;font-weight:800;color:var(--sub);margin:8px 0 6px}
.stars{display:flex;align-items:center}.stars span{font-size:23px;line-height:1;color:var(--off);padding:0 1px;cursor:pointer}.stars span.on{color:var(--gold)}
.sum{background:var(--sumbg);border:1px solid var(--sumbd);border-radius:14px;padding:14px;margin-bottom:14px;text-align:center;font-size:12px;color:var(--sub)}.sum b{color:var(--ink);font-weight:800}
.big{font:500 30px/1.2 Georgia,serif;color:var(--ink)}.big small{display:block;margin:4px 0 8px;font:700 10px -apple-system,"Noto Sans KR",sans-serif;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}.chips span{background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--ink)}
.seg{display:flex;gap:7px;margin:4px 0 12px}.seg button{flex:1;border:1px solid var(--line);background:var(--white);color:var(--sub);border-radius:11px;padding:10px;font-size:11px;font-weight:750}.seg button.on{background:var(--soft);border-color:var(--softbd);color:var(--softtx)}
h3{display:flex;align-items:center;gap:8px;margin:21px 0 10px;font-size:13px;font-weight:850;letter-spacing:-.2px}h3:before{content:"";width:3px;height:14px;background:var(--accent);border-radius:3px}
.tip{background:var(--note);border:1px solid var(--line);border-radius:13px;padding:11px 12px;color:var(--sub);font-size:12px;line-height:1.55;margin:0 0 8px}
.it{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:13px;padding:10px 11px;background:var(--white);margin-bottom:7px;font-size:12.5px;line-height:1.45}
.empty{padding:34px 18px;text-align:center;color:var(--sub);font-size:12px}
.err{background:var(--dbg);color:var(--danger);padding:11px 14px;border-radius:12px;margin:0 0 12px;font-size:12px;font-weight:600}
.tw{overflow:auto;border:1px solid var(--line);border-radius:15px;background:var(--white)}table{border-collapse:collapse;width:100%;font-size:11px}
th,td{border-bottom:1px solid var(--line);padding:10px 7px;text-align:center;white-space:nowrap}tr:last-child td{border:0}th{background:var(--thead);font-weight:800;color:var(--sub)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--paper);z-index:2;font-weight:800;font-size:12px}th:first-child{background:var(--thead);z-index:3}
td.best{font-weight:900;color:var(--besttx);background:var(--bestbg)!important}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font:500 18px Georgia,serif}.mh button{background:var(--soft);color:var(--softtx);width:34px;height:34px;padding:0;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;border:1px solid var(--line);border-radius:15px;background:var(--white);padding:8px;text-align:center}
.cal div{padding:8px 0 5px;border-radius:50%;font-size:12px;font-weight:800;cursor:pointer;min-height:44px;aspect-ratio:1}.cal .h{background:none;color:#837a73;font-size:10px;cursor:default;min-height:0;aspect-ratio:auto;padding:4px 0 6px}
.cal .h:nth-child(1){color:#b56e69}.cal .h:nth-child(7){color:#6e89a5}
.cal .sel{background:var(--ink);color:var(--onink)}.cal .td{box-shadow:inset 0 0 0 1.5px var(--accent)}.cal i{display:block;font-size:7px;color:var(--accent);font-style:normal;line-height:1.4}.cal .sel i{color:var(--onink)}
.ev{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:var(--white);margin-bottom:8px;font-size:12px}.ev>div{flex:1}.ev b{font-weight:800}.ev .meta{font-size:11px;color:var(--sub);margin-top:3px}.ev button{padding:7px 10px;font-size:11px}
</style>




</head>
<body><div class="bar"><div class="brand"><div><div class="bm">WEDDING JOURNAL</div><div class="bt">HALL NOTE</div></div><div class="br">TAEHYUNG × JINA</div></div><nav><button data-t="secret">암행투어</button><button data-t="consult">상담투어</button><button data-t="cmp">종합비교</button><button data-t="cal">일정</button></nav></div>
<div class="wrap">
<div id="err"></div><div id="app"><div class="empty">불러오는 중…</div></div>
</div>
<script>
const SEC=[["주차장",["주차장 입구를 찾기 쉬운가?","주차 안내 직원이 있는가?","주차장 → 홀 이동 동선이 원활한가?","주차장에서 홀까지 가는 엘리베이터/계단 확인 (엘리베이터 대기시간도 확인)","안내 표지판이 충분한가?","유모차/휠체어 이동이 원활한가?","엘리베이터 안에 예식장 안내가 잘 되어있는가?","다른 상가로 인해 복잡한가?","주말 예식 여러 타임이 겹칠 때 주차가 감당될 것 같은가?"]],
["로비",["다른 예식 하객과 동선이 섞이지 않는가?","로비의 원활함, 쾌적함 확인","화장실에 줄이 생기는가?","신부 입장 전에 하객들이 제대로 착석해 있는가?","직원의 응대는 친절한가?"],"하객을 볼 것. 실제 운영의 문제점은 하객 표정과 동선에서 더 잘 보인다"],
["홀 내부",["홀 내부의 층고나 홀의 분위기가 맘에 드는가?","하객석에서 무대가 잘 보이는가?","기둥 때문에 시야가 가려지는 좌석은 없는가?","스크린의 크기와 위치는 적절한가?","신랑, 신부 입장이 잘 보이는가?","버진로드가 너무 짧거나 길지는 않은가?","음향이 울리거나 답답하지 않은가?","조명이 너무 어둡거나 눈부시지 않은가?"]],
["연회장",["예식홀 → 연회장의 경로가 원활한가?","연회장 내부 간격과 느낌은 쾌적한가?"]]];
const NOTES=[["pros","직접 느낀 장점"],["cons","직접 느낀 단점"],["guest","내가 하객이라면 불편할 점"],["ask","계약 전에 반드시 물어볼 것"]];
const P={tae:"태형",jina:"진아"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,f1=n=>n?n.toFixed(1):"-";
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let col,ecol,halls=new Map(),events=new Map(),tab="secret",open=new Set(),who=ls("who")||"tae",today=new Date(),cm={y:today.getFullYear(),m:today.getMonth()},sel=ymd(today),ev={date:sel},timers=new Map();
const cat=d=>d.cat==="secret"?"secret":"consult";
const showErr=m=>{$("#err").innerHTML=m?'<div class="err">'+esc(m)+'</div>':""};
const nerr=e=>showErr(e&&e.code==="invalid_argument"?"수정 권한이 없어요. 공유 설정에서 편집 가능(Contributor 이상)으로 초대해 주세요.":"오류: "+(e&&e.message));

function stats(d){const r=d.r||{};const g=(ws,si)=>{const v=[];ws.forEach(w=>SEC.forEach((s,i)=>{if(si!=null&&si!==i)return;s[1].forEach((_,j)=>{const n=(r[w]||{})["s"+i+"i"+j];if(n>0)v.push(n)})}));return avg(v)};
return{tae:g(["tae"]),jina:g(["jina"]),all:g(["tae","jina"]),secs:SEC.map((_,i)=>g(["tae","jina"],i))}}
function save(id,path,val){const o={};let t=o;const p=path.split(".");p.slice(0,-1).forEach(k=>{t=t[k]={}});t[p[p.length-1]]=val;return col.doc(id).update(o).catch(nerr)}
const stars=(v,k,id)=>`<div class="stars" data-id="${id}" data-k="${k}">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=v?"on":""}">★</span>`).join("")}</div>`;
const inp=(id,f,type,val,lab)=>`<div><label class="l">${lab}</label><input data-id="${id}" data-f="${f}" type="${type}" value="${esc(val)}"></div>`;
const seg=(id,k,val,opts)=>`<div class="seg">${opts.map(([v,t])=>`<button data-act="yn" data-id="${id}" data-k="${k}" data-v="${v}" class="${val===v?"on":""}">${t}</button>`).join("")}</div>`;

function card(id,d){
  const c=cat(d)==="secret",s=c?stats(d):null,o=open.has(id);
  const sc=c?(s.all?"★ "+f1(s.all):""):(d.rating?"★ "+d.rating:"");
  let h=`<div class="card"><div class="top" data-act="tg" data-id="${id}"><b>${esc(d.name)}</b><span class="meta">${d.date?d.date.slice(5).replace("-","/"):""}</span><span class="sc">${sc}</span></div>`;
  if(!o)return h+"</div>";
  h+=`<div class="body">`;
  if(c){
    h+=`<div class="sum"><div class="big">${f1(s.all)}<small>/ 5 두 사람 평균</small></div><div>태형 <b>${f1(s.tae)}</b> · 진아 <b>${f1(s.jina)}</b></div><div class="chips">${SEC.map((x,i)=>`<span>${x[0]} ${f1(s.secs[i])}</span>`).join("")}</div></div>`;
    h+=`<div class="row">${inp(id,"date","date",d.date,"방문일")}${inp(id,"time","time",d.time,"방문 시간")}</div>`;
    h+=`<label class="l">작성자 선택 (내 이름을 눌러 입력)</label><div class="seg">${Object.entries(P).map(([k,n])=>`<button data-act="who" data-w="${k}" class="${who===k?"on":""}">${n}</button>`).join("")}</div>`;
    SEC.forEach((x,i)=>{h+=`<h3 class="c${i}">${x[0]}</h3>`+(x[2]?`<div class="tip">💡 ${x[2]}</div>`:"");x[1].forEach((t,j)=>{const k="s"+i+"i"+j;h+=`<div class="it"><span>${t}</span>${stars(((d.r||{})[who]||{})[k]||0,k,id)}</div>`})});
    h+=`<h3>메모 (${P[who]})</h3>`+NOTES.map(([k,t])=>`<label class="l">${t}</label><textarea data-id="${id}" data-f="notes.${who}.${k}">${esc((((d.notes||{})[who])||{})[k])}</textarea>`).join("");
  }else{
    h+=`<div class="sum"><div class="big">${d.rating?d.rating+".0":"-"}<small>/ 5 총 평점</small></div></div>`;
    h+=`<div class="row">${inp(id,"date","date",d.date,"방문일")}${inp(id,"time","time",d.time,"방문 시간")}</div>`;
    h+=`<label class="l">시식</label>${seg(id,"tasting",d.tasting,[["y","시식 해 봄"],["n","안 해 봄"]])}<label class="l">주류</label>${seg(id,"drink",d.drink,[["y","주류 포함"],["n","미포함"]])}`;
    h+=`<div class="row">${inp(id,"manager","text",d.manager,"상담 담당자")}${inp(id,"slot","text",d.slot,"예식 가능 일정")}</div><div class="row">${inp(id,"total","text",d.total,"총 견적")}${inp(id,"disc","text",d.disc,"할인받은 견적")}</div><div class="row">${inp(id,"meal","text",d.meal,"식대")}${inp(id,"min","text",d.min,"보증인원")}</div>`;
    h+=`<label class="l" style="margin-top:14px">특전 · 할인 메모</label><textarea data-id="${id}" data-f="perk" placeholder="특전, 할인 조건, 프로모션 등">${esc(d.perk)}</textarea><label class="l" style="margin-top:14px">총 평점</label>${stars(d.rating||0,"rating",id)}`;
  }
  return h+`<div style="margin-top:12px;text-align:right"><button class="g" data-act="del" data-id="${id}">삭제</button></div></div></div>`;
}
function listView(){
  const a=[...halls].filter(([,d])=>cat(d)===tab).sort((x,y)=>(x[1].created||0)-(y[1].created||0));
  return `<div class="add"><input id="nm" placeholder="웨딩홀 이름 추가" maxlength="40"><button data-act="add">추가</button></div>`+(a.map(([id,d])=>card(id,d)).join("")||`<div class="empty">아직 등록된 웨딩홀이 없어요.</div>`);
}
function cmpView(){
  const m=new Map();halls.forEach(d=>{const k=(d.name||"").trim().toLowerCase();if(!m.has(k))m.set(k,{name:d.name,s:null,c:null});m.get(k)[cat(d)==="secret"?"s":"c"]=d});
  const rows=[...m.values()].map(e=>{const s=e.s?stats(e.s):null,cr=(e.c&&e.c.rating)||0,p=[];if(s&&s.all)p.push(s.all);if(cr)p.push(cr);return{e,s,cr,tot:avg(p)}}).sort((a,b)=>b.tot-a.tot);
  if(!rows.length)return `<div class="empty">암행투어·상담투어에 웨딩홀을 추가하면 여기서 비교돼요.<br>(같은 이름이면 한 줄로 합쳐져요)</div>`;
  const cols=[["종합",r=>r.tot],["암행 평균",r=>r.s&&r.s.all],["태형",r=>r.s&&r.s.tae],["진아",r=>r.s&&r.s.jina],...SEC.map((x,i)=>[x[0],r=>r.s&&r.s.secs[i]]),["상담 평점",r=>r.cr]];
  const mx=cols.map(([,f])=>Math.max(0,...rows.map(r=>f(r)||0)));
  const t=r=>(r.e.c||{});
  return `<div class="tw"><table><tr><th>웨딩홀</th>${cols.map(c=>`<th>${c[0]}</th>`).join("")}<th>할인 견적</th><th>식대</th><th>보증</th></tr>`+rows.map(r=>`<tr><td>${esc(r.e.name)}</td>${cols.map(([,f],i)=>{const v=f(r)||0;return `<td class="${v&&v===mx[i]?"best":""}">${f1(v)}</td>`}).join("")}<td>${esc(t(r).disc||t(r).total||"-")}</td><td>${esc(t(r).meal||"-")}</td><td>${esc(t(r).min||"-")}</td></tr>`).join("")+`</table></div><p class="meta">★ 점수는 5점 만점, 진한 색은 해당 항목 최고점. 종합 = 암행 평균과 상담 평점의 평균.</p>`;
}
function dayItems(d){const a=[...events].filter(([,e])=>e.date===d).map(([id,e])=>({id,...e})).sort((x,y)=>(x.start||"").localeCompare(y.start||""));
  const hs=[...halls.values()].filter(h=>h.date===d).map(h=>({title:(cat(h)==="secret"?"[암행] ":"[상담] ")+h.name,start:h.time,ro:1}));return [...a,...hs]}
function calView(){
  const {y,m}=cm,first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  let g=["일","월","화","수","목","금","토"].map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(first);
  for(let i=1;i<=dim;i++){const ds=y+"-"+pad(m+1)+"-"+pad(i),n=dayItems(ds).length;g+=`<div data-act="day" data-d="${ds}" class="${ds===sel?"sel":""} ${ds===ymd(today)?"td":""}">${i}<i>${n?"●"+(n>1?n:""):"&nbsp;"}</i></div>`}
  const li=dayItems(sel).map(e=>`<div class="ev"><div><b>${esc(e.title)}</b><div class="meta">${esc(e.start||"")}${e.end?" ~ "+esc(e.end):""}${e.memo?" · "+esc(e.memo):""}</div></div>${e.ro?"":`<button class="g" data-act="ee" data-id="${e.id}">수정</button><button class="g" data-act="ed" data-id="${e.id}">삭제</button>`}</div>`).join("")||`<div class="empty" style="padding:12px">이 날 일정이 없어요.</div>`;
  const f=(k,type,lab)=>`<div><label class="l">${lab}</label><input data-f="ev" data-k="${k}" type="${type}" value="${esc(ev[k])}"></div>`;
  return `<div class="mh"><button class="g" data-act="mo" data-v="-1">‹</button><span>${y}년 ${m+1}월</span><button class="g" data-act="mo" data-v="1">›</button></div><div class="cal">${g}</div><h3>${sel.slice(5).replace("-","/")} 일정</h3>${li}<h3>${ev.id?"일정 수정":"일정 추가"}</h3>${f("title","text","제목")}<div class="row" style="margin-top:8px">${f("date","date","날짜")}${f("start","time","시작")}</div><div class="row">${f("end","time","종료")}${f("memo","text","메모")}</div><div style="display:flex;gap:8px;margin-top:6px"><button data-act="es">${ev.id?"수정 저장":"추가"}</button>${ev.id?`<button class="g" data-act="ec">취소</button>`:""}</div>`;
}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));$("#app").innerHTML=tab==="cmp"?cmpView():tab==="cal"?calView():listView()}
function tryRender(){const a=document.activeElement;if(timers.size||(a&&/INPUT|TEXTAREA/.test(a.tagName)))return;render()}

document.addEventListener("input",e=>{const t=e.target,f=t.dataset.f;if(!f)return;
  if(f==="ev"){ev[t.dataset.k]=t.value;return}
  const key=t.dataset.id+f;clearTimeout(timers.get(key));
  timers.set(key,setTimeout(()=>{timers.delete(key);save(t.dataset.id,f,t.value).finally(tryRender)},400))});
document.addEventListener("focusout",()=>setTimeout(tryRender,80));
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="nm")add()});
async function add(){const i=$("#nm"),n=i&&i.value.trim();if(!n)return;if(!col){showErr("아직 공유 DB에 연결되지 않았어요. 새로고침 후 다시 시도해 주세요.");return}i.value="";i.blur();showErr("");try{await col.doc().set({name:n,cat:tab,created:Date.now()})}catch(e){nerr(e)}}
document.addEventListener("click",async e=>{
  const nb=e.target.closest("nav button");if(nb){tab=nb.dataset.t;render();return}
  const st=e.target.closest(".stars span");
  if(st){const w=st.parentNode,id=w.dataset.id,k=w.dataset.k,d=halls.get(id),n=+st.dataset.n,c=k==="rating"?d.rating:((d.r||{})[who]||{})[k];save(id,k==="rating"?k:"r."+who+"."+k,c===n?0:n);return}
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==="add")add();
  else if(a==="tg"){open.has(id)?open.delete(id):open.add(id);render()}
  else if(a==="who"){who=el.dataset.w;ls("who",who);render()}
  else if(a==="yn"){const d=halls.get(id);save(id,el.dataset.k,d[el.dataset.k]===el.dataset.v?"":el.dataset.v)}
  else if(a==="del"){if(confirm("삭제할까요? 함께 보는 사람 화면에서도 사라져요."))col.doc(id).delete().catch(nerr)}
  else if(a==="mo"){cm.m+=+el.dataset.v;if(cm.m<0){cm.m=11;cm.y--}if(cm.m>11){cm.m=0;cm.y++}render()}
  else if(a==="day"){sel=el.dataset.d;if(!ev.id)ev.date=sel;render()}
  else if(a==="ee"){ev={id,...events.get(id)};render()}
  else if(a==="ec"){ev={date:sel};render()}
  else if(a==="ed"){if(confirm("이 일정을 삭제할까요?"))ecol.doc(id).delete().catch(nerr)}
  else if(a==="es"){if(!(ev.title||"").trim())return;const o={title:ev.title.trim(),date:ev.date||sel,start:ev.start||"",end:ev.end||"",memo:ev.memo||""};
    try{ev.id?await ecol.doc(ev.id).update(o):await ecol.doc().set(o);sel=o.date;ev={date:sel};render()}catch(x){nerr(x)}}
});
(async()=>{const db=await claude.use("db");
  if(!db){$("#app").innerHTML='<div class="empty">로그인 후 열어야 공유 기능이 동작해요.</div>';return}
  col=db.collection("halls");ecol=db.collection("events");
  col.onSnapshot(s=>{halls=new Map(s.docs.map(x=>[x.id,x.data()]));tryRender()},nerr);
  ecol.onSnapshot(s=>{events=new Map(s.docs.map(x=>[x.id,x.data()]));tryRender()},nerr);render()})();
</script></body></html>
